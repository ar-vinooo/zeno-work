name: Release

# Windows app tidak bisa dibangun dari macOS tanpa Wine, dan sebaliknya juga
# begitu. Karena itu tiap sistem dibangun di runner-nya sendiri.
#
# Dua tahap, dan pemisahan ini WAJIB: kalau kedua job memanggil
# `electron-builder --publish` sendiri-sendiri, keduanya berlomba membuat
# release untuk tag yang sama dan hasilnya dua draft dengan aset terbelah.
# Jadi job build tidak pernah menyentuh GitHub Release — mereka hanya menitipkan
# berkas, lalu satu job terakhir yang merilis semuanya sekaligus.
#
# Pemicunya tag `v*`. Versi di tag harus sama dengan "version" di package.json.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (arm64 + x64)
            args: --mac --arm64 --x64
          - os: windows-latest
            label: Windows (x64)
            args: --win --x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Segarkan npm
        run: npm install -g npm@latest

      - name: Info toolchain
        run: |
          node --version
          npm --version

      - run: npm ci --prefer-offline --no-audit

      - name: Build halaman statis
        run: npm run build

      - name: Kompilasi proses utama
        run: npm run electron:build

      - name: Paket aplikasi
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # Runner tidak punya sertifikat Apple. Tanpa baris ini
          # electron-builder mencari identitas penanda tangan lalu gagal.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap
            release/latest*.yml

  release:
    name: Terbitkan Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Unggah ke GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -lh dist
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "ZenoWork $TAG" --generate-notes
          fi
